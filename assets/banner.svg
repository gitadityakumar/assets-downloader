<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">ast — Asset Downloader</title>
  <desc id="desc">Banner for the ast multi-provider asset search and download CLI</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="photoA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="photoB" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="612" y="58" width="148" height="112" rx="12"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="960" height="280" rx="24" fill="url(#bg)"/>
  <rect width="960" height="280" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="278" rx="23" fill="none" stroke="#334155" stroke-opacity="0.55"/>

  <!-- Soft glow orbs -->
  <circle cx="160" cy="40" r="90" fill="#22d3ee" fill-opacity="0.08"/>
  <circle cx="820" cy="240" r="110" fill="#6366f1" fill-opacity="0.12"/>

  <!-- Left: terminal-style mark -->
  <g filter="url(#soft)">
    <rect x="56" y="58" width="168" height="164" rx="20" fill="#0f172a" stroke="#334155"/>
    <!-- title bar dots -->
    <circle cx="80" cy="82" r="5" fill="#f87171"/>
    <circle cx="98" cy="82" r="5" fill="#fbbf24"/>
    <circle cx="116" cy="82" r="5" fill="#34d399"/>
    <line x1="56" y1="98" x2="224" y2="98" stroke="#1e293b" stroke-width="1"/>

    <!-- prompt lines -->
    <text x="76" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#64748b">$</text>
    <text x="94" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#e2e8f0">ast s</text>
    <text x="76" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#22d3ee">aura</text>
    <text x="120" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#a5b4fc">"fox"</text>
    <text x="76" y="180" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">↓ downloads/</text>
    <text x="76" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#34d399">ok · 3 files</text>
  </g>

  <!-- Center copy -->
  <g>
    <text x="268" y="108" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">ast</text>
    <text x="268" y="148" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="600" fill="url(#accent)">Asset Downloader</text>
    <text x="268" y="182" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" fill="#94a3b8">Multi-provider search &amp; download CLI</text>

    <!-- pills -->
    <g>
      <rect x="268" y="204" width="72" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="304" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#22d3ee">Zig 0.16</text>

      <rect x="350" y="204" width="64" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="382" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc">MIT</text>

      <rect x="424" y="204" width="88" height="28" rx="14" fill="#0f172a" stroke="#334155"/>
      <text x="468" y="223" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">scriptable</text>
    </g>
  </g>

  <!-- Right: stacked image cards + download -->
  <g filter="url(#soft)">
    <!-- back card -->
    <rect x="640" y="72" width="148" height="112" rx="12" fill="#1e293b" stroke="#334155" transform="rotate(6 714 128)"/>
    <!-- middle card -->
    <rect x="624" y="64" width="148" height="112" rx="12" fill="#1e293b" stroke="#475569" transform="rotate(-4 698 120)"/>
    <!-- front card -->
    <rect x="612" y="58" width="148" height="112" rx="12" fill="url(#frame)" stroke="#64748b"/>
    <g clip-path="url(#cardClip)">
      <rect x="612" y="58" width="148" height="112" fill="url(#photoA)"/>
      <circle cx="655" cy="88" r="14" fill="#fde68a" fill-opacity="0.9"/>
      <path d="M612 142 L652 108 L678 128 L704 96 L760 142 Z" fill="url(#photoB)" fill-opacity="0.85"/>
      <path d="M612 170 H760 V170 Q760 170 760 170 H612 Z" fill="#0f172a" fill-opacity="0.15"/>
    </g>
    <!-- image icon corners -->
    <rect x="612" y="58" width="148" height="112" rx="12" fill="none" stroke="#94a3b8" stroke-opacity="0.35"/>

    <!-- download badge -->
    <g transform="translate(780 148)">
      <circle cx="0" cy="0" r="28" fill="url(#accent)"/>
      <circle cx="0" cy="0" r="28" fill="none" stroke="#e0f2fe" stroke-opacity="0.35"/>
      <path d="M0 -10 v14" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M-7 4 L0 12 L7 4" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-10 16 h20" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- provider chips under cards -->
  <g>
    <rect x="612" y="188" width="58" height="24" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="641" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">aura</text>
    <rect x="678" y="188" width="78" height="24" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="717" y="204" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">unsplash</text>
  </g>
</svg>
